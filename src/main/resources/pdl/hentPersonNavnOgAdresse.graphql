query($ident: ID!){
    hentPerson(ident: $ident) {
        navn(historikk: false) {
            fornavn,
            mellomnavn,
            etternavn,
            forkortetNavn,
        }
        bostedsadresse(historikk: false ) {
              vegadresse {
                  adressenavn,
                  postnummer,
                  husnummer,
                  husbokstav,
                  tilleggsnavn,
                  kommunenummer,
              }
        }
        adressebeskyttelse(historikk: false) { gradering }
    }
}